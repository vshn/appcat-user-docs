name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  APPUIO_PROJECT_NAME: vshn-docs
  IMAGE_NAME: appcat-user-docs
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  build:
    name: Build Antora Site 🏗️
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Antora Site
        id: build_site
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}-site
          tags: latest
          containerfiles: |
            ./deployment/main/Containerfile
          oci: true

      # A built image proves nothing: run it and ask it for a page. buildah keeps the image in
      # its own storage, which the docker CLI in the smoke test cannot see, so copy it into the
      # Docker daemon first. This runs before the push step, so a bad image is never published.
      - name: Smoke test the built image
        env:
          BUILT_IMAGE: ${{ steps.build_site.outputs.image-with-tag }}
        run: |
          buildah push "$BUILT_IMAGE" docker-daemon:appcat-user-docs-site:smoke
          sh tests/smoke.sh appcat-user-docs-site:smoke /index.html "AppCat"


      # Pull requests build the images to prove they still build, and stop
      # there. Nothing is published or deployed from a PR.
      - name: Push Antora Site Image
        if: github.event_name == 'push'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build_site.outputs.image }}
          tags: ${{ steps.build_site.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}


  deploy:
    name: Deploy Antora Site 🚀
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenShift CLI tools
        uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "latest"

      - name: Authenticate and set context
        uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.APPUIO_PROJECT_NAME }}

      - name: Apply Manifests
        run: |
          sed -i "s#SITEIMAGE#ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-site:latest#" deployment/deployment.yaml
          sed -i "s#GITSHAFULL#$GITHUB_SHA#" deployment/deployment.yaml
          oc apply -f deployment/

      # oc apply returns as soon as the API server accepts the manifests, so this job reported
      # success whether or not the new pod ever started. The pod template carries the commit SHA
      # in an annotation, so every apply changes it and Kubernetes always starts a rollout, which
      # means waiting for that rollout is enough and nothing has to be triggered by hand.
      # The container's readiness probe asks the site for /index.html, so a rollout that
      # completes is a pod that is actually serving a page, not merely a pod that exists.
      - name: Wait for the rollout
        run: oc rollout status deployment/appcat-user --timeout=5m
