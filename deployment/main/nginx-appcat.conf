# Site-specific rules for docs.appcat.ch, included by the base image's server block
# (/etc/nginx/conf.d/default.conf) through `include /etc/nginx/antora/*.conf`.
# Caching, compression and error pages come from that image.

# The search container this site used to run answered /search, and the base image still proxies
# there for the sites that have not migrated. Search now runs in the reader's browser from the
# Pagefind index in this image, and that endpoint only ever spoke JSON to the search page's own
# XHR, so nothing calls it. A regex location takes precedence over the base image's prefix
# location (a second prefix location of the same name would be a duplicate and nginx would refuse
# to start), and answering here keeps requests away from a backend that no longer exists, which
# would otherwise be a 502 per request in the log. Anchored with (/|$) so a page called
# /searchable.html is not swallowed by it.
location ~ ^/search(/|$) {
    return 404;
}
